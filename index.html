<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WeChat</title>
  
  <!-- 1. 图标配置 -->
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icon.png">

  <!-- 2. 移动端 App 全屏标准配置 (消除 deprecated 警告) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WeChat">
  <meta name="theme-color" content="#2dc100">

  <!-- 3. 内嵌式 Manifest (解决 404 导致的 Line 1 Column 1 Syntax error) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"WeChat","short_name":"WeChat","start_url":"/","display":"standalone","background_color":"%232dc100","theme_color":"%232dc100","icons":[{"src":"/icon.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --md-sys-color-primary: #006a60;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #74f8e5;
      --md-sys-color-on-primary-container: #00201c;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f4fbf7;
      --md-sys-color-surface-container: #edf5f1;
      --md-sys-color-surface-container-high: #e7efeb;
      --md-sys-color-surface-container-highest: #e1e9e5;
      --md-sys-color-on-surface: #191c1b;
      --md-sys-color-on-surface-variant: #3f4946;
      --md-sys-color-outline: #6f7976;
      --md-sys-color-outline-variant: #bec9c5;
      --md-sys-color-secondary-container: #cce8e2;
      --md-sys-color-on-secondary-container: #05201c;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 20px;
      --md-shape-corner-full: 9999px;

      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.12), 0 1px 2px 0 rgba(0,0,0,0.2);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px 0 rgba(0,0,0,0.3);
      --md-elevation-3: 0 4px 12px 3px rgba(0,0,0,0.15), 0 1px 3px 0 rgba(0,0,0,0.25);
      --md-elevation-floating: 0 8px 28px rgba(0,0,0,0.2), 0 3px 10px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Noto Sans SC', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }

    /* 1. 导航 Rail */
    .nav-rail {
      width: 68px;
      height: 100%;
      background: var(--md-sys-color-surface-container);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      z-index: 20;
      flex-shrink: 0;
    }

    .user-avatar-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      margin-bottom: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--md-sys-color-primary-container);
      box-shadow: var(--md-elevation-1);
    }
    .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

    .nav-item {
      width: 48px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      position: relative;
      transition: all 0.2s ease;
    }
    .nav-item:hover { background: var(--md-sys-color-surface-container-high); }
    .nav-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .nav-label { display: none; font-size: 11px; margin-top: 2px; }

    .badge-dot {
      position: absolute;
      top: 6px;
      right: 10px;
      width: 8px;
      height: 8px;
      background: var(--md-sys-color-error);
      border-radius: 50%;
      display: none;
      z-index: 10;
    }
    .badge-dot.show { display: block; }

    .nav-spacer { flex: 1; }

    /* 2. 侧边栏列表 */
    .chat-sidebar {
      width: 320px;
      height: 100%;
      background: var(--md-sys-color-surface-container-low);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      height: 38px;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: var(--md-sys-color-outline);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--md-shape-corner-full);
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:hover { background: var(--md-sys-color-surface-container-highest); }

    .list-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .list-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--md-shape-corner-medium);
      cursor: pointer;
      gap: 12px;
      margin-bottom: 4px;
      transition: background 0.2s;
      position: relative;
    }
    .list-item:hover { background: var(--md-sys-color-surface-container); }
    .list-item.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .list-item.pinned {
      background: var(--md-sys-color-surface-container-high);
      border-left: 3px solid var(--md-sys-color-primary);
    }

    .list-avatar-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .list-avatar {
      width: 100%;
      height: 100%;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-surface-container-highest);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .list-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .item-badge-unread {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      background: var(--md-sys-color-error);
      border: 2px solid var(--md-sys-color-surface);
      border-radius: 50%;
      z-index: 10;
    }

    .list-info { flex: 1; min-width: 0; }
    .list-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
    .list-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
    .list-time { font-size: 11px; opacity: 0.7; }
    .list-desc { font-size: 13px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 3. 右侧主工作区 */
    .stage-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--md-sys-color-surface);
      position: relative;
      z-index: 15;
    }

    .stage-header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
    }
    .stage-header-left { display: flex; align-items: center; gap: 8px; }
    .mobile-back-btn { display: none; }
    .stage-title { font-size: 16px; font-weight: 600; }

    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--md-sys-color-surface-container-lowest);
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 76%;
      user-select: text;
      position: relative;
    }
    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-row.received { align-self: flex-start; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      flex-shrink: 0;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-bubble-wrap { display: flex; flex-direction: column; gap: 4px; }

    .msg-bubble {
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      cursor: context-menu;
      transition: filter 0.2s;
    }
    .msg-bubble:hover { filter: brightness(0.97); }

    .message-row.sent .msg-bubble {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 20px 4px 20px 20px;
    }
    .message-row.received .msg-bubble {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-radius: 4px 20px 20px 20px;
    }

    .msg-quote-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      margin-bottom: 4px;
      border-left: 2px solid var(--md-sys-color-primary);
      color: inherit;
      opacity: 0.85;
      word-break: break-word;
    }
    .message-row.sent .msg-quote-badge {
      background: rgba(255, 255, 255, 0.18);
      border-left-color: #ffffff;
    }

    .msg-recalled {
      font-size: 12px;
      color: var(--md-sys-color-outline);
      background: var(--md-sys-color-surface-container);
      padding: 4px 12px;
      border-radius: var(--md-shape-corner-full);
      align-self: center;
      margin: 4px 0;
    }

    .file-bubble {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
      cursor: context-menu;
    }
    .file-bubble .material-symbols-outlined { font-size: 32px; color: var(--md-sys-color-primary); }

    .img-bubble {
      max-width: 240px;
      max-height: 240px;
      border-radius: var(--md-shape-corner-medium);
      cursor: pointer;
      object-fit: cover;
    }

    .chat-input-area {
      padding: 8px 16px 12px 16px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quote-preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--md-sys-color-surface-container-highest);
      padding: 6px 12px;
      border-radius: var(--md-shape-corner-small);
      border-left: 3px solid var(--md-sys-color-primary);
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .quote-preview-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
    }

    .chat-textarea {
      width: 100%;
      height: 56px;
      resize: none;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      background: transparent;
      user-select: text;
    }

    .requests-panel {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .req-card {
      background: var(--md-sys-color-surface-container);
      padding: 14px 16px;
      border-radius: var(--md-shape-corner-medium);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .req-user-info { display: flex; align-items: center; gap: 12px; }
    .req-user-avatar { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .req-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .req-meta-name { font-weight: 600; font-size: 14px; }
    .req-meta-msg { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 3px; }
    .req-meta-time { font-size: 11px; color: var(--md-sys-color-outline); margin-top: 2px; }
    .req-actions { display: flex; gap: 8px; align-items: center; }

    /* 4. MD3 右键上下文菜单 */
    .md3-context-menu {
      position: fixed;
      display: none;
      z-index: 2500;
      min-width: 150px;
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-medium);
      box-shadow: var(--md-elevation-3);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 6px 0;
      animation: menuFadeIn 0.12s ease-out;
    }

    @keyframes menuFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .context-menu-item {
      padding: 9px 16px;
      font-size: 13px;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease;
    }
    .context-menu-item:hover { background: var(--md-sys-color-surface-container-high); }
    .context-menu-item.danger { color: var(--md-sys-color-error); }
    .context-menu-item.danger:hover { background: var(--md-sys-color-error-container); }
    .context-menu-divider { height: 1px; background: var(--md-sys-color-outline-variant); margin: 4px 0; }

    /* 5. 弹窗系统 */
    .draggable-modal-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
      display: none;
      z-index: 1000;
    }
    .draggable-modal-wrapper.open { display: block; }

    .md3-window {
      position: absolute;
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-large);
      box-shadow: var(--md-elevation-floating);
      border: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
    }

    .window-header-drag {
      padding: 6px 14px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      font-weight: 600;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .window-header-drag .icon-btn { width: 28px; height: 28px; }
    .window-header-drag .icon-btn .material-symbols-outlined { font-size: 18px; }

    .window-content {
      padding: 16px 20px;
      overflow-y: auto;
      max-height: calc(85vh - 40px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .apply-form-group { display: flex; flex-direction: column; gap: 4px; }
    .apply-form-label { font-size: 12px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); }
    .apply-textarea {
      width: 100%;
      height: 70px;
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      resize: none;
    }
    .apply-input {
      width: 100%;
      height: 38px;
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    .quick-text-btn { font-size: 11px; color: var(--md-sys-color-primary); cursor: pointer; }

    .radio-option { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; margin-top: 2px; }
    .radio-option input[type="radio"] { accent-color: var(--md-sys-color-primary); width: 15px; height: 15px; }

    .btn-filled {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 6px 18px;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border: none;
      padding: 6px 16px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .btn-text {
      background: transparent;
      border: none;
      padding: 6px 14px;
      color: var(--md-sys-color-outline);
      cursor: pointer;
      font-size: 13px;
    }
    .btn-danger {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-error);
      border: none;
      padding: 6px 14px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    #fileInput, #popoutFileInput { display: none; }

    /* 6. 移动端 UI 适配 */
    @media (max-width: 768px) {
      .app-viewport { flex-direction: column-reverse; }

      .nav-rail {
        width: 100vw;
        height: 56px;
        flex-direction: row;
        justify-content: space-around;
        padding: 0;
        border-right: none;
        border-top: 1px solid var(--md-sys-color-outline-variant);
        background: var(--md-sys-color-surface);
      }
      .user-avatar-btn { display: none; }
      .nav-spacer { display: none; }
      .nav-item {
        margin-bottom: 0;
        width: auto;
        height: 100%;
        flex: 1;
        border-radius: 0;
        background: transparent !important;
      }
      .nav-item.active { color: var(--md-sys-color-primary); }
      .nav-label { display: block; }
      .nav-item .material-symbols-outlined { font-size: 22px; }

      .chat-sidebar {
        width: 100vw;
        height: calc(100vh - 56px);
        border-right: none;
      }

      .stage-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 100;
        display: none;
      }
      .stage-container.mobile-active { display: flex; }
      .mobile-back-btn { display: flex; }

      .md3-window {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 90vw !important;
        max-width: 360px !important;
      }
      .window-header-drag { cursor: default; }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- 1. 导航 Rail -->
    <aside class="nav-rail">
      <div class="user-avatar-btn" id="myAvatarBtn" onclick="openProfileCard()" title="个人信息">
        <img id="myAvatarImg" src="" alt="Me">
      </div>

      <div class="nav-item active" id="navChatBtn" onclick="switchNavTab('chat')" title="微信">
        <span class="material-symbols-outlined">chat_bubble</span>
        <span class="nav-label">微信</span>
      </div>

      <div class="nav-item" id="navContactsBtn" onclick="switchNavTab('contacts')" title="通讯录">
        <span class="material-symbols-outlined">contacts</span>
        <span class="nav-label">通讯录</span>
        <div class="badge-dot" id="contactBadgeDot"></div>
      </div>

      <div class="nav-spacer"></div>

      <div class="nav-item" id="navSettingsBtn" onclick="openSettingsModal()" title="我">
        <span class="material-symbols-outlined">person</span>
        <span class="nav-label">我</span>
      </div>
    </aside>

    <!-- 2. 会话列表侧边栏 -->
    <section class="chat-sidebar" id="chatSidebar">
      <div class="sidebar-header">
        <div class="search-box">

  <script>
    // ====================================================
    // 1. Supabase 与 WebPush 配置
    // ====================================================
    const SUPABASE_URL = "https://mamubvgmcetepllznifl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_HEeNPSqD75cWlnmZjcVHKA_Pw-OdL_A";
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // 🔴 请在此填入实际生成的 VAPID Public Key (若未配置，前端将安全跳过推送注册)
    const VAPID_PUBLIC_KEY = "BMVUuTJ0K6hICjU7Zcjv8cs6kIN1gOLcctsYntQagVeMmW1v5GoZ7IBQR0NcG1Ds99HMVOobQHbHVQ2zOksezhs";

    // ====================================================
    // 2. 全局状态
    // ====================================================
    let currentUser = { name: "", isLoggedIn: false, avatar: "" };
    let currentTab = "chat";
    let contacts = []; 
    let activeChatId = ""; 
    let currentChatMessages = []; 
    let friendRequests = []; 
    let tempTargetUser = null; 

    let contextTargetContactId = null;
    let contextTargetMsg = null;
    let currentQuoteData = null;

    // ====================================================
    // 3. WebPush 注册 (加入安全 Base64 校验，杜绝 atob 报错)
    // ====================================================
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function initWebPush(isManual = false) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        document.getElementById('pushStatus').innerText = '当前浏览器不支持推送';
        return;
      }

      // 🌟 安全检查：如果未替换占位符或公钥格式不正确，友好提示并不抛出异常
      if (!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.includes("你的_") || VAPID_PUBLIC_KEY.length < 20) {
        document.getElementById('pushStatus').innerText = '未配置公钥';
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
          if (!isManual && Notification.permission !== 'granted') {
            document.getElementById('pushStatus').innerText = '未授权推送';
            return;
          }
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') {
            document.getElementById('pushStatus').innerText = '通知权限已被拒绝';
            return;
          }

          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }

        document.getElementById('pushStatus').innerText = '已启用';
        document.getElementById('enablePushBtn').style.display = 'none';

        if (sbClient && currentUser.name) {
          const subJson = subscription.toJSON();
          const endpointUrl = subscription.endpoint;

          const { data: existing } = await sbClient
            .from('user_subscriptions')
            .select('id')
            .eq('user_id', currentUser.name)
            .eq('endpoint', endpointUrl)
            .maybeSingle();

          if (existing) {
            await sbClient
              .from('user_subscriptions')
              .update({ subscription: subJson, updated_at: new Date().toISOString() })
              .eq('id', existing.id);
          } else {
            await sbClient
              .from('user_subscriptions')
              .insert({ user_id: currentUser.name, subscription: subJson, updated_at: new Date().toISOString() });
          }
        }
      } catch (err) {
        console.error("WebPush 初始化失败:", err);
        document.getElementById('pushStatus').innerText = '配置异常';
      }
    }

    async function triggerWebPushNotification(targetUser, title, body, url = "/") {
      try {
        await fetch(`${SUPABASE_URL}/functions/v1/push-notification`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ target_user: targetUser, title: title, body: body, url: url })
        });
      } catch (err) {
        console.error("调用 Edge Function 失败:", err);
      }
    }

    // ====================================================
    // 4. 用户初始化
    // ====================================================
    async function initUserInfo() {
      const IS_DEV_LOGIN = false;

      if (IS_DEV_LOGIN) {
        currentUser = { name: "本地调试员", isLoggedIn: true, avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=dev_user" };
        await postInit();
        return;
      }

      try {
        const res = await fetch("/api/userinfo");
        if (res.ok) {
          const result = await res.json();
          if (result.loggedIn && result.data && result.data.username) {
            currentUser = {
              name: result.data.username,
              isLoggedIn: true,
              avatar: result.data.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${result.data.username}`
            };
          } else {
            throw new Error("未登录");
          }
        } else {
          throw new Error("网络响应异常");
        }
      } catch (e) {
        let guestName = localStorage.getItem("MD3_GUEST_UNAME");
        if (!guestName) {
          guestName = `橙子_${Math.floor(Math.random() * 1000)}`;
          localStorage.setItem("MD3_GUEST_UNAME", guestName);
        }
        currentUser = { 
          name: guestName, 
          isLoggedIn: false, 
          avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${guestName}` 
        };
      }

      await postInit();
    }

    async function postInit() {
      document.getElementById("myAvatarImg").src = currentUser.avatar;
      document.getElementById("cardAvatar").src = currentUser.avatar;
      document.getElementById("cardName").innerText = currentUser.name;

      loadContacts();
      await loadFriendRequests();
      initRealtimeSub();
      initWebPush();
    }

    // ====================================================
    // 5. 联系人管理
    // ====================================================
    function loadContacts() {
      const storageKey = `MD3_CONTACTS_${currentUser.name}`;
      const saved = localStorage.getItem(storageKey);
      
      if (saved) {
        contacts = JSON.parse(saved);
      } else {
        contacts = [
          {
            id: currentUser.name,
            name: `${currentUser.name} (自己)`,
            avatar: currentUser.avatar,
            lastMsg: "文件传输助手",
            lastTime: "刚刚",
            timestamp: Date.now(),
            isPinned: false,
            isMuted: false,
            isUnread: false,
            isHidden: false
          }
        ];
        saveContacts();
      }

      activeChatId = contacts.find(c => !c.isHidden)?.id || contacts[0]?.id || "";
      renderCurrentTabList();
      loadMessagesForActiveChat();
    }

    function saveContacts() {
      localStorage.setItem(`MD3_CONTACTS_${currentUser.name}`, JSON.stringify(contacts));
    }

    function addContactIfNotExists(contact) {
      const existing = contacts.find(c => c.id === contact.id);
      if (!existing) {
        contacts.push({
          isPinned: false,
          isMuted: false,
          isUnread: false,
          isHidden: false,
          ...contact
        });
        saveContacts();
        renderCurrentTabList();
      }
    }

    function switchNavTab(tab) {
      currentTab = tab;
      document.getElementById("navChatBtn").classList.toggle("active", tab === "chat");
      document.getElementById("navContactsBtn").classList.toggle("active", tab === "contacts");

      if (tab === "chat") {
        document.getElementById("chatPane").style.display = "flex";
        document.getElementById("contactsPane").style.display = "none";
        document.getElementById("stageTitle").innerText = contacts.find(c => c.id === activeChatId)?.name || "聊天";
      } else {
        document.getElementById("chatPane").style.display = "none";
        document.getElementById("contactsPane").style.display = "flex";
        document.getElementById("stageTitle").innerText = "新的朋友与验证通知";
        renderFriendRequestsList();
      }
      renderCurrentTabList();
    }

    function renderCurrentTabList(filteredList = null) {
      const container = document.getElementById("listScrollContainer");
      container.innerHTML = "";

      if (currentTab === "contacts") {
        const pendingCount = friendRequests.filter(r => r.receiver_id === currentUser.name && r.status === 'pending').length;
        const newFriendItem = document.createElement("div");
        newFriendItem.className = "list-item";
        newFriendItem.onclick = () => {
          switchNavTab("contacts");
          if (window.innerWidth <= 768) openMobileChat();
        };
        newFriendItem.innerHTML = `
          <div class="list-avatar-wrapper">
            <div class="list-avatar" style="background:var(--md-sys-color-primary); color:white;">
              <span class="material-symbols-outlined">person_add</span>
            </div>
          </div>
          <div class="list-info">
            <div class="list-top"><span class="list-name">新的朋友</span></div>
            <div class="list-desc">${pendingCount > 0 ? `有 ${pendingCount} 条待处理申请` : '暂无新申请'}</div>
          </div>
        `;
        container.appendChild(newFriendItem);
      }

      let list = filteredList || contacts.filter(c => !c.isHidden);
      list.sort((a, b) => {
        if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
        return (b.timestamp || 0) - (a.timestamp || 0);
      });

      list.forEach(contact => {
        const item = document.createElement("div");
        item.className = `list-item ${contact.id === activeChatId && currentTab === 'chat' ? 'active' : ''} ${contact.isPinned ? 'pinned' : ''}`;
        
        item.onclick = () => {
          contact.isUnread = false;
          saveContacts();
          if (currentTab === 'contacts') switchNavTab('chat');
          switchChat(contact.id);
          if (window.innerWidth <= 768) openMobileChat();
        };
        
        item.oncontextmenu = (e) => openFriendContextMenu(e, contact.id);

        item.innerHTML = `
          <div class="list-avatar-wrapper">
            <div class="list-avatar">
              <img src="${contact.avatar}" alt="">
            </div>
            ${contact.isUnread ? '<div class="item-badge-unread"></div>' : ''}
          </div>
          <div class="list-info">
            <div class="list-top">
              <span class="list-name">
                ${contact.name}
                ${contact.isMuted ? '<span class="material-symbols-outlined" style="font-size:14px; opacity:0.6;">volume_off</span>' : ''}
              </span>
              <span class="list-time">${contact.lastTime || ''}</span>
            </div>
            <div class="list-desc">${contact.lastMsg || ''}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function filterList() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!query) {
        renderCurrentTabList();
        return;
      }
      const filtered = contacts.filter(c => c.name.toLowerCase().includes(query));
      renderCurrentTabList(filtered);
    }

    function switchChat(contactId) {
      activeChatId = contactId;
      const current = contacts.find(c => c.id === activeChatId);
      if (current) {
        current.isUnread = false;
        saveContacts();
        document.getElementById("stageTitle").innerText = current.name;
      }
      renderCurrentTabList();
      loadMessagesForActiveChat();

    function positionMenu(e, menuEl) {
      menuEl.style.display = "block";
      const menuWidth = menuEl.offsetWidth || 150;
      const menuHeight = menuEl.offsetHeight || 180;
      
      let left = e.clientX;
      let top = e.clientY;

      if (left + menuWidth > window.innerWidth) left = window.innerWidth - menuWidth - 10;
      if (top + menuHeight > window.innerHeight) top = window.innerHeight - menuHeight - 10;

      menuEl.style.left = `${left}px`;
      menuEl.style.top = `${top}px`;
    }

            </div>
            <div style="font-weight:600; font-size:14px;">${found.name}</div>
          </div>
          <div>
            ${isAlreadyFriend 
              ? `<button class="btn-tonal" onclick="closeModal('addFriendModalWrapper'); switchChat('${found.name}');">发消息</button>`

    async function submitFriendRequest() {
      if (!tempTargetUser) return;
      const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
      const now = Date.now();

      const existingReq = friendRequests.find(r => 
        r.sender_id === currentUser.name && 
        r.receiver_id === tempTargetUser.name && 
        r.status === 'pending' &&
        (now - new Date(r.created_at).getTime()) < SEVEN_DAYS_MS
      );

      if (existingReq) {
        alert("您已发送过好友申请，7天有效期内请耐心等待对方受理！");
        closeModal('applyModalWrapper');
        return;
      }

      const reqPayload = {
        id: `req_${Date.now()}_${Math.random().toString(36).substring(2,6)}`,
        sender_id: currentUser.name,
        sender_name: currentUser.name,
        sender_avatar: currentUser.avatar,
        receiver_id: tempTargetUser.name,
        receiver_name: tempTargetUser.name,
        message: document.getElementById("applyMessageInput").value.trim(),
        remark: document.getElementById("applyRemarkInput").value.trim(),
        permission: document.querySelector('input[name="friendPermission"]:checked').value,
        status: 'pending',
        created_at: new Date().toISOString()
      };

      friendRequests.unshift(reqPayload);
      saveFriendRequests();

      try {
        if (sbClient) {
          await sbClient.from('friend_requests').insert([reqPayload]);
          triggerWebPushNotification(tempTargetUser.name, `好友申请: ${currentUser.name}`, reqPayload.message || '请求添加你为朋友');
        }
      } catch (e) {}

      alert("好友申请已发送！");
      closeModal('applyModalWrapper');
      switchNavTab('contacts');
    }

    async function loadFriendRequests() {
      const saved = localStorage.getItem(`MD3_REQ_${currentUser.name}`);
      if (saved) friendRequests = JSON.parse(saved);

      try {
        if (sbClient) {
          const { data, error } = await sbClient
            .from('friend_requests')
            .select('*')
            .or(`receiver_id.eq.${currentUser.name},sender_id.eq.${currentUser.name}`)
            .order('created_at', { ascending: false });

          if (!error && data) {
            friendRequests = data;
            saveFriendRequests();

            friendRequests.forEach(req => {
              if (req.status === 'accepted') {
                if (req.sender_id === currentUser.name) {
                  addContactIfNotExists({
                    id: req.receiver_id,
                    name: req.receiver_name || req.receiver_id,
                    avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${req.receiver_id}`,
                    lastMsg: "对方已通过好友申请，开始聊天吧",
                    lastTime: "已同意",
                    timestamp: new Date(req.created_at).getTime()
                  });
                } else if (req.receiver_id === currentUser.name) {
                  addContactIfNotExists({
                    id: req.sender_id,
                    name: req.remark || req.sender_name || req.sender_id,
                    avatar: req.sender_avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${req.sender_id}`,
                    lastMsg: "已通过好友申请，开始聊天吧",
                    lastTime: "已同意",
                    timestamp: new Date(req.created_at).getTime()
                  });
                }
              }
            });
          }
        }
      } catch (e) {}

      checkBadgeDot();
    }

    function saveFriendRequests() {
      localStorage.setItem(`MD3_REQ_${currentUser.name}`, JSON.stringify(friendRequests));
      checkBadgeDot();
    }

    function checkBadgeDot() {
      const hasPending = friendRequests.some(r => r.receiver_id === currentUser.name && r.status === 'pending');
      document.getElementById("contactBadgeDot").classList.toggle("show", hasPending);
    }

    function renderFriendRequestsList() {
      const container = document.getElementById("requestsPanel");
      container.innerHTML = "";

      if (friendRequests.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); margin-top:40px;">暂无好友验证消息</div>`;
        return;
      }

      const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
      const now = Date.now();

      friendRequests.forEach(req => {
        const isIncoming = req.receiver_id === currentUser.name;
        const isExpired = (now - new Date(req.created_at).getTime()) > SEVEN_DAYS_MS;
        const card = document.createElement("div");
        card.className = "req-card";

        let statusText = "待受理";
        if (req.status === 'accepted') statusText = "已同意";
        else if (req.status === 'rejected') statusText = "已拒绝";
        else if (isExpired) statusText = "已过期";

        card.innerHTML = `
          <div class="req-user-info">
            <div class="req-user-avatar">
              <img src="${isIncoming ? req.sender_avatar : 'https://api.dicebear.com/7.x/bottts/svg?seed=' + req.receiver_name}">
            </div>
            <div>
              <div class="req-meta-name">${isIncoming ? req.sender_name : req.receiver_name} ${isIncoming ? '<span style="font-size:11px; color:var(--md-sys-color-primary);">(对方申请)</span>' : '<span style="font-size:11px; color:var(--md-sys-color-outline);">(我发起的)</span>'}</div>
              <div class="req-meta-msg">“${req.message || '申请添加你为朋友'}”</div>
              <div class="req-meta-time">${new Date(req.created_at).toLocaleDateString()} ${new Date(req.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            </div>
          </div>
          <div class="req-actions">
            ${isIncoming && req.status === 'pending' && !isExpired ? `
              <button class="btn-filled" onclick="handleRequest('${req.id}', 'accepted')">接受</button>
              <button class="btn-danger" onclick="handleRequest('${req.id}', 'rejected')">拒绝</button>
            ` : `
              <span style="font-size:13px; font-weight:500; color:var(--md-sys-color-outline);">${statusText}</span>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function handleRequest(reqId, action) {
      const req = friendRequests.find(r => r.id === reqId);
      if (!req) return;

      req.status = action;
      saveFriendRequests();
      renderFriendRequestsList();

      if (action === 'accepted') {
        addContactIfNotExists({
          id: req.sender_id,
          name: req.remark || req.sender_name,
          avatar: req.sender_avatar,
          lastMsg: "已通过好友申请，开始聊天吧",
          lastTime: "刚刚",
          timestamp: Date.now()
        });

        activeChatId = req.sender_id;
        await sendMessage("text", { content: "我通过了你的好友验证请求，现在我们可以开始聊天了。" });
      }

      try {
        if (sbClient) {
          await sbClient.from('friend_requests').update({ status: action }).eq('id', reqId);
          triggerWebPushNotification(req.sender_id, `好友申请已被${action === 'accepted' ? '通过' : '拒绝'}`, `${currentUser.name} ${action === 'accepted' ? '同意了你的好友申请' : '拒绝了你的好友申请'}`);
        }
      } catch (e) {}
    }

    // ====================================================
    // 9. 消息收发与实时订阅
    // ====================================================
    async function loadMessagesForActiveChat() {
      const container = document.getElementById("messagesViewport");
      container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); font-size:12px;">加载记录中...</div>`;

      try {
        if (!sbClient) throw new Error("No client");
        const { data, error } = await sbClient
          .from('messages')
          .select('*')
          .or(`and(sender_id.eq.${currentUser.name},receiver_id.eq.${activeChatId}),and(sender_id.eq.${activeChatId},receiver_id.eq.${currentUser.name})`)
          .order('created_at', { ascending: true });

        if (error) throw error;
        currentChatMessages = data || [];
      } catch (err) {
        const localKey = `MSGS_${currentUser.name}_${activeChatId}`;
        currentChatMessages = JSON.parse(localStorage.getItem(localKey) || "[]");
      }
      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById("messagesViewport");
      container.innerHTML = "";

      if (currentChatMessages.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); font-size:12px; margin-top:20px;">暂无历史消息</div>`;
        return;
      }

      currentChatMessages.forEach(msg => {
        if (msg.is_recalled) {
          const recallRow = document.createElement("div");
          recallRow.className = "msg-recalled";
          recallRow.innerText = msg.sender_id === currentUser.name ? "你撤回了一条消息" : `${msg.sender_id} 撤回了一条消息`;
          container.appendChild(recallRow);
          return;
        }

        const isMe = msg.sender_id === currentUser.name;
        const row = document.createElement("div");
        row.className = `message-row ${isMe ? 'sent' : 'received'}`;
        
        let contentHtml = "";
        let quoteHtml = "";

        if (msg.quote) {
          quoteHtml = `<div class="msg-quote-badge">「${msg.quote.sender}：${msg.quote.content}」</div>`;
        }

        if (msg.msg_type === 'image') {
          contentHtml = `<img src="${msg.file_url}" class="img-bubble" onclick="window.open('${msg.file_url}')">`;
        } else if (msg.msg_type === 'file') {
          contentHtml = `
            <a href="${msg.file_url}" target="_blank" class="file-bubble" download="${msg.file_name}">
              <span class="material-symbols-outlined">description</span>
              <div>
                <div style="font-weight:500; font-size:13px;">${msg.file_name}</div>
                <div style="font-size:11px; opacity:0.7;">${msg.file_size || '文件'}</div>
              </div>
            </a>`;
        } else {
          contentHtml = `<div class="msg-bubble">${quoteHtml}${msg.content}</div>`;
        }

        const avatar = isMe ? currentUser.avatar : (contacts.find(c=>c.id === msg.sender_id)?.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + msg.sender_id);
        
        row.innerHTML = `
          <div class="msg-avatar"><img src="${avatar}"></div>
          <div class="msg-bubble-wrap">${contentHtml}</div>
        `;

        row.oncontextmenu = (e) => openMessageContextMenu(e, msg);
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(type = "text", payload = {}) {
      const textarea = document.getElementById("chatInput");
      const content = payload.content || textarea.value.trim();
      if (!content && type === 'text') return;

      const newMsg = {
        sender_id: currentUser.name,
        receiver_id: activeChatId,
        msg_type: type,
        content: content || '',
        quote: currentQuoteData || payload.quote || null,
        file_url: payload.file_url || null,
        file_name: payload.file_name || null,
        file_size: payload.file_size || null,
        created_at: new Date().toISOString()
      };

      currentChatMessages.push(newMsg);
      renderMessages();
      if (type === 'text') textarea.value = "";
      cancelQuote();

      const c = contacts.find(item => item.id === activeChatId);
      if (c) {
        c.lastMsg = type === 'text' ? content : `[${type}]`;
        c.lastTime = "刚刚";
        c.timestamp = Date.now();
        c.isUnread = false;
        saveContacts();
        renderCurrentTabList();
      }

      try {
        if (!sbClient) throw new Error();
        await sbClient.from('messages').insert([newMsg]);

        if (activeChatId !== currentUser.name) {
          triggerWebPushNotification(activeChatId, `${currentUser.name} 发来一条消息`, type === 'text' ? content : `[${type}]`);
        }
      } catch (e) {
        localStorage.setItem(`MSGS_${currentUser.name}_${activeChatId}`, JSON.stringify(currentChatMessages));
      }
    }

    function initRealtimeSub() {
      if (!sbClient) return;

      sbClient.channel('realtime:chat_sync')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          if (msg.receiver_id === currentUser.name) {
            const isCurrentlyActive = (activeChatId === msg.sender_id && document.visibilityState === 'visible');

            addContactIfNotExists({
              id: msg.sender_id,
              name: msg.sender_id,
              avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${msg.sender_id}`,
              lastMsg: msg.msg_type === 'text' ? msg.content : `[${msg.msg_type}]`,
              lastTime: "刚刚",
              timestamp: Date.now(),
              isUnread: !isCurrentlyActive
            });

            if (msg.sender_id === activeChatId) {
              currentChatMessages.push(msg);
              renderMessages();
            }
          }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
          const updatedMsg = payload.new;
          const idx = currentChatMessages.findIndex(m => m.id === updatedMsg.id);
          if (idx !== -1) {
            currentChatMessages[idx] = updatedMsg;
            renderMessages();
          }
        })
        .on('broadcast', { event: 'delete_friend_sync' }, payload => {
          const data = payload.payload;
          if (data && data.target === currentUser.name) {
            contacts = contacts.filter(c => c.id !== data.sender);
            saveContacts();
            if (activeChatId === data.sender) {
              activeChatId = contacts[0]?.id || "";
            }
            renderCurrentTabList();
            loadMessagesForActiveChat();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'friend_requests' }, payload => {
          const req = payload.new;
          if (!req) return;

          if (req.receiver_id === currentUser.name || req.sender_id === currentUser.name) {
            const idx = friendRequests.findIndex(r => r.id === req.id);
            if (idx >= 0) {
              friendRequests[idx] = req;
            } else {
              friendRequests.unshift(req);
            }
            saveFriendRequests();

            if (req.status === 'accepted') {
              if (req.sender_id === currentUser.name) {
                addContactIfNotExists({
                  id: req.receiver_id,
                  name: req.receiver_name || req.receiver_id,
                  avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${req.receiver_id}`,
                  lastMsg: "对方已通过好友申请，开始聊天吧",
                  lastTime: "刚刚",
                  timestamp: Date.now()
                });
              } else if (req.receiver_id === currentUser.name) {
                addContactIfNotExists({
                  id: req.sender_id,
                  name: req.remark || req.sender_name || req.sender_id,
                  avatar: req.sender_avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${req.sender_id}`,
                  lastMsg: "已通过好友申请，开始聊天吧",
                  lastTime: "刚刚",
                  timestamp: Date.now()
                });
              }
            }

            if (currentTab === 'contacts') renderFriendRequestsList();
            renderCurrentTabList();
          }
        })
        .subscribe();
    }

    // ====================================================
    // 10. 文件处理与交互
    // ====================================================
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith("image/");
      const reader = new FileReader();
      reader.onload = async (event) => {
        await sendMessage(isImage ? 'image' : 'file', {
          content: isImage ? '[图片]' : `[文件] ${file.name}`,
          file_url: event.target.result,
          file_name: file.name,
          file_size: `${(file.size / 1024).toFixed(1)} KB`
        });
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function insertEmoji(emoji) {
      const input = document.getElementById("chatInput");
      input.value += emoji;
      input.focus();
    }

    // ====================================================
    // 11. 窗口自由拖拽机制
    // ====================================================
    let dragState = { isDragging: false, currentEl: null, startX: 0, startY: 0, initialLeft: 0, initialTop: 0 };

    function startDrag(e, elementId) {
      if (window.innerWidth <= 768) return;
      const el = document.getElementById(elementId);
      dragState.isDragging = true;
      dragState.currentEl = el;
      dragState.startX = e.clientX;
      dragState.startY = e.clientY;
      dragState.initialLeft = el.offsetLeft;
      dragState.initialTop = el.offsetTop;

      document.addEventListener("mousemove", onDragging);
      document.addEventListener("mouseup", stopDrag);
    }

    function onDragging(e) {
      if (!dragState.isDragging || !dragState.currentEl) return;
      const el = dragState.currentEl;
      
      let newLeft = dragState.initialLeft + (e.clientX - dragState.startX);
      let newTop = dragState.initialTop + (e.clientY - dragState.startY);

      const maxLeft = window.innerWidth - el.offsetWidth;
      const maxTop = window.innerHeight - el.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      el.style.left = `${newLeft}px`;
      el.style.top = `${newTop}px`;
    }

    function stopDrag() {
      dragState.isDragging = false;
      dragState.currentEl = null;
      document.removeEventListener("mousemove", onDragging);
      document.removeEventListener("mouseup", stopDrag);
    }

    function openModal(wrapperId) { document.getElementById(wrapperId).classList.add("open"); }
    function closeModal(wrapperId) { document.getElementById(wrapperId).classList.remove("open"); }

    function openProfileCard() { openModal("profileModalWrapper"); }
    function openAddFriendModal() { 
      document.getElementById("searchResultDisplay").innerHTML = "";
      document.getElementById("searchUsernameInput").value = "";
      openModal("addFriendModalWrapper"); 
    }
    function openSettingsModal() { 
      document.getElementById("setUname").innerText = currentUser.name;
      openModal("settingsModalWrapper"); 
    }

    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener("DOMContentLoaded", initUserInfo);
  </script>
