<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MD3 Cloud Chat</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Supabase JS Client (仅用于消息与申请的实时通信和存储) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      /* Google Material Design 3 Tokens */
      --md-sys-color-primary: #006a60;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #74f8e5;
      --md-sys-color-on-primary-container: #00201c;
      --md-sys-color-surface: #fbfdfa;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f5fbf7;
      --md-sys-color-surface-container: #eff5f1;
      --md-sys-color-surface-container-high: #e9efeb;
      --md-sys-color-surface-container-highest: #e3e9e5;
      --md-sys-color-on-surface: #191c1b;
      --md-sys-color-on-surface-variant: #3f4946;
      --md-sys-color-outline: #6f7976;
      --md-sys-color-outline-variant: #bec9c5;
      --md-sys-color-secondary-container: #cce8e2;
      --md-sys-color-on-secondary-container: #05201c;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 16px;
      --md-shape-corner-large: 24px;
      --md-shape-corner-full: 9999px;

      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.12), 0 1px 2px 0 rgba(0,0,0,0.2);
      --md-elevation-3: 0 6px 16px 4px rgba(0,0,0,0.12), 0 2px 4px 0 rgba(0,0,0,0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Noto Sans SC', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    /* 1. 左侧导航 Rail */
    .nav-rail {
      width: 68px;
      height: 100%;
      background: var(--md-sys-color-surface-container);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      z-index: 10;
      flex-shrink: 0;
    }

    .user-avatar-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      margin-bottom: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--md-sys-color-primary-container);
      box-shadow: var(--md-elevation-1);
    }
    .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

    .nav-item {
      width: 48px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      position: relative;
      transition: all 0.2s ease;
    }
    .nav-item:hover { background: var(--md-sys-color-surface-container-high); }
    .nav-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .badge-dot {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 8px;
      height: 8px;
      background: var(--md-sys-color-error);
      border-radius: 50%;
      display: none;
    }
    .badge-dot.show { display: block; }

    .nav-spacer { flex: 1; }

    /* 2. 中间列表侧边栏 (消息/通讯录通用) */
    .chat-sidebar {
      width: 320px;
      height: 100%;
      background: var(--md-sys-color-surface-container-low);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      height: 38px;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: var(--md-sys-color-outline);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--md-shape-corner-full);
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:hover { background: var(--md-sys-color-surface-container-highest); }

    .list-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .list-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--md-shape-corner-medium);
      cursor: pointer;
      gap: 12px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    .list-item:hover { background: var(--md-sys-color-surface-container); }
    .list-item.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    .list-avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-surface-container-highest);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .list-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .list-info { flex: 1; min-width: 0; }
    .list-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
    .list-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-time { font-size: 11px; opacity: 0.7; }
    .list-desc { font-size: 13px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 3. 右侧主工作区 */
    .stage-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--md-sys-color-surface);
      position: relative;
    }

    .stage-header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
    }
    .stage-title { font-size: 16px; font-weight: 600; }

    /* 消息视口 */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--md-sys-color-surface-container-lowest);
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 72%;
      user-select: text;
    }
    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-row.received { align-self: flex-start; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      flex-shrink: 0;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-bubble {
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .message-row.sent .msg-bubble {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 20px 4px 20px 20px;
    }
    .message-row.received .msg-bubble {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-radius: 4px 20px 20px 20px;
    }

    .file-bubble {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
    }
    .file-bubble .material-symbols-outlined { font-size: 32px; color: var(--md-sys-color-primary); }

    .img-bubble {
      max-width: 260px;
      max-height: 260px;
      border-radius: var(--md-shape-corner-medium);
      cursor: pointer;
      object-fit: cover;
    }

    .chat-input-area {
      padding: 12px 20px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-textarea {
      width: 100%;
      height: 64px;
      resize: none;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      background: transparent;
      user-select: text;
    }

    /* 通讯录：新的朋友申请管理面板 */
    .requests-panel {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .req-card {
      background: var(--md-sys-color-surface-container);
      padding: 16px 20px;
      border-radius: var(--md-shape-corner-medium);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .req-user-info { display: flex; align-items: center; gap: 14px; }
    .req-user-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .req-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .req-meta-name { font-weight: 600; font-size: 15px; }
    .req-meta-msg { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }
    .req-meta-time { font-size: 11px; color: var(--md-sys-color-outline); margin-top: 2px; }
    .req-actions { display: flex; gap: 8px; align-items: center; }

    /* ================= 4. MD3 自由拖拽窗口系统 ================= */
    .draggable-modal-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      display: none;
      z-index: 1000;
    }
    .draggable-modal-wrapper.open { display: block; }

    .md3-window {
      position: absolute;
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-large);
      box-shadow: var(--md-elevation-3);
      border: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .window-header-drag {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      font-weight: 600;
      font-size: 15px;
    }

    .window-content {
      padding: 20px;
      overflow-y: auto;
      max-height: calc(85vh - 60px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 申请添加朋友表单 */
    .apply-form-group { display: flex; flex-direction: column; gap: 6px; }
    .apply-form-label { font-size: 12px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); }
    .apply-textarea {
      width: 100%;
      height: 80px;
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 10px;
      font-size: 13px;
      outline: none;
      resize: none;
    }
    .apply-input {
      width: 100%;
      height: 40px;
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    .quick-text-btn { font-size: 12px; color: var(--md-sys-color-primary); cursor: pointer; margin-top: -2px; }

    .radio-option { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; margin-top: 4px; }
    .radio-option input[type="radio"] { accent-color: var(--md-sys-color-primary); width: 16px; height: 16px; }

    /* 按钮 */
    .btn-filled {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 8px 20px;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border: none;
      padding: 8px 18px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .btn-text {
      background: transparent;
      border: none;
      padding: 8px 16px;
      color: var(--md-sys-color-outline);
      cursor: pointer;
      font-size: 13px;
    }
    .btn-danger {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-error);
      border: none;
      padding: 8px 16px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- 1. 左侧导航 Rail -->
    <aside class="nav-rail">
      <div class="user-avatar-btn" id="myAvatarBtn" onclick="openProfileCard()" title="个人信息">
        <img id="myAvatarImg" src="" alt="Me">
      </div>

      <div class="nav-item active" id="navChatBtn" onclick="switchNavTab('chat')" title="消息">
        <span class="material-symbols-outlined">chat_bubble</span>
      </div>

      <div class="nav-item" id="navContactsBtn" onclick="switchNavTab('contacts')" title="通讯录">
        <span class="material-symbols-outlined">contacts</span>
        <div class="badge-dot" id="contactBadgeDot"></div>
      </div>

      <div class="nav-spacer"></div>

      <div class="nav-item" id="navSettingsBtn" onclick="openSettingsModal()" title="更多/设置">
        <span class="material-symbols-outlined">menu</span>
      </div>
    </aside>

    <!-- 2. 会话列表 / 通讯录侧边栏 -->
    <section class="chat-sidebar">
      <div class="sidebar-header">
        <div class="search-box">
          <span class="material-symbols-outlined" style="font-size: 18px;">search</span>
          <input type="text" id="searchInput" placeholder="搜索..." oninput="filterList()">
        </div>
        <button class="icon-btn" title="添加好友" onclick="openAddFriendModal()">
          <span class="material-symbols-outlined">add</span>
        </button>
      </div>

      <div class="list-scroll-area" id="listScrollContainer"></div>
    </section>

    <!-- 3. 右侧主工作区 -->
    <main class="stage-container">
      <div class="stage-header">
        <div class="stage-title" id="stageTitle">聊天</div>
        <button class="icon-btn"><span class="material-symbols-outlined">more_horiz</span></button>
      </div>

      <!-- 消息面板 -->
      <div id="chatPane" style="display:flex; flex-direction:column; flex:1; height:calc(100% - 60px);">
        <div class="messages-viewport" id="messagesViewport"></div>

        <div class="chat-input-area">
          <div style="display:flex; gap:6px;">
            <button class="icon-btn" title="表情" onclick="insertEmoji('😊')">
              <span class="material-symbols-outlined">mood</span>
            </button>
            <button class="icon-btn" title="上传文件" onclick="document.getElementById('fileInput').click()">
              <span class="material-symbols-outlined">folder</span>
            </button>
            <input type="file" id="fileInput" onchange="handleFileUpload(event)">
          </div>

          <textarea class="chat-textarea" id="chatInput" placeholder="输入消息 (Enter 发送)..."></textarea>

          <div style="display:flex; justify-content:flex-end;">
            <button class="btn-filled" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>

      <!-- 通讯录面板 -->
      <div id="contactsPane" style="display:none; flex-direction:column; flex:1; height:calc(100% - 60px);">
        <div class="requests-panel" id="requestsPanel"></div>
      </div>
    </main>
  </div>

  <!-- ================= 4. 可拖拽 MD3 弹窗系统 ================= -->

  <!-- 弹窗 1: 搜索用户窗口 -->
  <div class="draggable-modal-wrapper" id="addFriendModalWrapper">
    <div class="md3-window" id="addFriendWin" style="width: 380px; top: 20%; left: 35%;">
      <div class="window-header-drag" onmousedown="startDrag(event, 'addFriendWin')">
        <span>添加好友</span>
        <button class="icon-btn" onclick="closeModal('addFriendModalWrapper')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="window-content">
        <!-- 搜索输入框与按钮排在一排 -->
        <div style="display: flex; gap: 8px;">
          <input type="text" class="apply-input" id="searchUsernameInput" placeholder="输入精确用户名..." style="flex:1;">
          <button class="btn-tonal" onclick="searchUserAction()">查找</button>
        </div>

        <div id="searchResultDisplay" style="margin-top: 10px;"></div>
      </div>
    </div>
  </div>

  <!-- 弹窗 2: 申请添加朋友窗口 -->
  <div class="draggable-modal-wrapper" id="applyModalWrapper">
    <div class="md3-window" id="applyWin" style="width: 360px; top: 15%; left: 38%;">
      <div class="window-header-drag" onmousedown="startDrag(event, 'applyWin')">
        <span>申请添加朋友</span>
        <button class="icon-btn" onclick="closeModal('applyModalWrapper')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="window-content">
        <div class="apply-form-group">
          <label class="apply-form-label">发送添加朋友申请</label>
          <textarea class="apply-textarea" id="applyMessageInput">我是 </textarea>
          <span class="quick-text-btn" onclick="document.getElementById('applyMessageInput').value='我是 ' + currentUser.name">设为常用申请语</span>
        </div>

        <div class="apply-form-group">
          <label class="apply-form-label">备注</label>
          <input type="text" class="apply-input" id="applyRemarkInput" placeholder="备注姓名">
        </div>

        <div class="apply-form-group">
          <label class="apply-form-label">标签</label>
          <input type="text" class="apply-input" id="applyTagInput" placeholder="搜索或创建标签...">
        </div>

        <div class="apply-form-group" style="border-top:1px solid var(--md-sys-color-outline-variant); padding-top:10px;">
          <label class="apply-form-label">朋友权限</label>
          <label class="radio-option">
            <input type="radio" name="friendPermission" value="all" checked>
            <span>聊天、朋友圈、微信运动等</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="friendPermission" value="chat_only">
            <span>仅聊天</span>
          </label>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
          <button class="btn-text" onclick="closeModal('applyModalWrapper')">取消</button>
          <button class="btn-filled" onclick="submitFriendRequest()">确定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 弹窗 3: 个人资料卡片 -->
  <div class="draggable-modal-wrapper" id="profileModalWrapper">
    <div class="md3-window" id="profileWin" style="width: 320px; top: 22%; left: 20%;">
      <div class="window-header-drag" onmousedown="startDrag(event, 'profileWin')">
        <span>个人名片</span>
        <button class="icon-btn" onclick="closeModal('profileModalWrapper')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="window-content" style="gap:14px;">
        <div style="display:flex; gap:14px; align-items:center;">
          <div style="width:56px; height:56px; border-radius:12px; overflow:hidden;">
            <img id="cardAvatar" src="" style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div>
            <div style="font-size:16px; font-weight:600;"><span id="cardName">--</span> <span>🍊</span></div>
            <div style="font-size:12px; color:var(--md-sys-color-outline);" id="cardUid">uid: --</div>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--md-sys-color-outline-variant); border-bottom:1px solid var(--md-sys-color-outline-variant);">
          <div style="font-size:12px; width:44px; color:var(--md-sys-color-on-surface-variant);">朋友圈</div>
          <div style="display:flex; gap:4px;">
            <div style="width:40px; height:40px; border-radius:4px; background-size:cover; background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100');"></div>
            <div style="width:40px; height:40px; border-radius:4px; background-size:cover; background-image:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=100');"></div>
            <div style="width:40px; height:40px; border-radius:4px; background-size:cover; background-image:url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=100');"></div>
          </div>
        </div>

        <div style="display:flex; justify-content:center;">
          <button class="btn-tonal" onclick="closeModal('profileModalWrapper'); switchChat(currentUser.id);">发消息</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 弹窗 4: 系统设置 -->
  <div class="draggable-modal-wrapper" id="settingsModalWrapper">
    <div class="md3-window" id="settingsWin" style="width: 360px; top: 25%; left: 36%;">
      <div class="window-header-drag" onmousedown="startDrag(event, 'settingsWin')">
        <span>系统设置</span>
        <button class="icon-btn" onclick="closeModal('settingsModalWrapper')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="window-content">
        <div style="font-size:13px; display:flex; flex-direction:column; gap:6px;">
          <div><strong>用户名：</strong><span id="setUname">--</span></div>
          <div><strong>身份 UID：</strong><span id="setUid">--</span></div>
          <div><strong>用户数据库：</strong>Cloudflare D1 (user-center)</div>
          <div><strong>实时消息通道：</strong>Supabase Realtime</div>
        </div>
        <div style="display:flex; justify-content:flex-end;">
          <button class="btn-tonal" onclick="closeModal('settingsModalWrapper')">完成</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====================================================
    // 1. Supabase 客户端配置 (仅负责消息/申请的实时通信与存储)
    // ====================================================
    const SUPABASE_URL = "https://mamubvgmcetepllznifl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_HEeNPSqD75cWlnmZjcVHKA_Pw-OdL_A";
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // ====================================================
    // 2. 全局状态
    // ====================================================
    let currentUser = { id: "", name: "", isLoggedIn: false, avatar: "" };
    let currentTab = "chat";
    let contacts = []; 
    let activeChatId = ""; 
    let currentChatMessages = []; 
    let friendRequests = []; 
    let tempTargetUser = null; 

    // ====================================================
    // 3. 用户初始化
    // ====================================================
    async function initUserInfo() {
      const IS_DEV_LOGIN = false;

      if (IS_DEV_LOGIN) {
        currentUser = { id: "dev_user_001", name: "本地调试员", isLoggedIn: true, avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=dev_user_001" };
        postInit();
        return;
      }

      try {
        const res = await fetch("/api/userinfo");
        if (res.ok) {
          const result = await res.json();
          if (result.loggedIn && result.data && result.data.username) {
            currentUser = {
              id: result.data.id || `user_${result.data.username}`,
              name: result.data.username,
              isLoggedIn: true,
              avatar: result.data.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${result.data.username}`
            };
          } else {
            throw new Error("未登录");
          }
        } else {
          throw new Error("网络响应异常");
        }
      } catch (e) {
        let guestId = localStorage.getItem("MD3_GUEST_UID");
        let guestName = localStorage.getItem("MD3_GUEST_UNAME");
        if (!guestId) {
          guestId = `guest_${Math.random().toString(36).substring(2, 10)}`;
          guestName = `橙子_${Math.floor(Math.random() * 1000)}`;
          localStorage.setItem("MD3_GUEST_UID", guestId);
          localStorage.setItem("MD3_GUEST_UNAME", guestName);
        }
        currentUser = { 
          id: guestId, 
          name: guestName, 
          isLoggedIn: false, 
          avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${guestId}` 
        };
      }

      postInit();
    }

    function postInit() {
      document.getElementById("myAvatarImg").src = currentUser.avatar;
      document.getElementById("cardAvatar").src = currentUser.avatar;
      document.getElementById("cardName").innerText = currentUser.name;
      document.getElementById("cardUid").innerText = `uid:${currentUser.id}`;

      loadContacts();
      loadFriendRequests();
      initRealtimeSub();
    }

    // ====================================================
    // 4. 联系人与列表管理
    // ====================================================
    function loadContacts() {
      const storageKey = `MD3_CONTACTS_${currentUser.id}`;
      const saved = localStorage.getItem(storageKey);
      
      if (saved) {
        contacts = JSON.parse(saved);
      } else {
        contacts = [
          {
            id: currentUser.id,
            name: `${currentUser.name} (自己)`,
            avatar: currentUser.avatar,
            lastMsg: "文件传输助手",
            lastTime: "刚刚",
            timestamp: Date.now()
          }
        ];
        saveContacts();
      }

      activeChatId = contacts[0].id;
      renderCurrentTabList();
      loadMessagesForActiveChat();
    }

    function saveContacts() {
      localStorage.setItem(`MD3_CONTACTS_${currentUser.id}`, JSON.stringify(contacts));
    }

    function switchNavTab(tab) {
      currentTab = tab;
      document.getElementById("navChatBtn").classList.toggle("active", tab === "chat");
      document.getElementById("navContactsBtn").classList.toggle("active", tab === "contacts");

      if (tab === "chat") {
        document.getElementById("chatPane").style.display = "flex";
        document.getElementById("contactsPane").style.display = "none";
        document.getElementById("stageTitle").innerText = contacts.find(c => c.id === activeChatId)?.name || "聊天";
      } else {
        document.getElementById("chatPane").style.display = "none";
        document.getElementById("contactsPane").style.display = "flex";
        document.getElementById("stageTitle").innerText = "新的朋友与验证通知";
        renderFriendRequestsList();
      }
      renderCurrentTabList();
    }

    function renderCurrentTabList(filteredList = null) {
      const container = document.getElementById("listScrollContainer");
      container.innerHTML = "";

      if (currentTab === "contacts") {
        const pendingCount = friendRequests.filter(r => r.receiver_id === currentUser.id && r.status === 'pending').length;
        const newFriendItem = document.createElement("div");
        newFriendItem.className = "list-item";
        newFriendItem.onclick = () => switchNavTab("contacts");
        newFriendItem.innerHTML = `
          <div class="list-avatar" style="background:var(--md-sys-color-primary); color:white;">
            <span class="material-symbols-outlined">person_add</span>
          </div>
          <div class="list-info">
            <div class="list-top"><span class="list-name">新的朋友</span></div>
            <div class="list-desc">${pendingCount > 0 ? `有 ${pendingCount} 条待处理申请` : '暂无新申请'}</div>
          </div>
        `;
        container.appendChild(newFriendItem);
      }

      const list = filteredList || contacts;
      list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      list.forEach(contact => {
        const item = document.createElement("div");
        item.className = `list-item ${contact.id === activeChatId && currentTab === 'chat' ? 'active' : ''}`;
        item.onclick = () => {
          if (currentTab === 'contacts') switchNavTab('chat');
          switchChat(contact.id);
        };
        item.innerHTML = `
          <div class="list-avatar"><img src="${contact.avatar}" alt=""></div>
          <div class="list-info">
            <div class="list-top">
              <span class="list-name">${contact.name}</span>
              <span class="list-time">${contact.lastTime || ''}</span>
            </div>
            <div class="list-desc">${contact.lastMsg || ''}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function filterList() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!query) {
        renderCurrentTabList();
        return;
      }
      const filtered = contacts.filter(c => c.name.toLowerCase().includes(query));
      renderCurrentTabList(filtered);
    }

    function switchChat(contactId) {
      activeChatId = contactId;
      renderCurrentTabList();
      const current = contacts.find(c => c.id === activeChatId);
      if (current) {
        document.getElementById("stageTitle").innerText = current.name;
      }
      loadMessagesForActiveChat();
    }

    // ====================================================
    // 5. 精确 D1 用户中心检索 (彻底移除虚拟假用户生成)
    // ====================================================
    async function searchUserAction() {
      const uname = document.getElementById("searchUsernameInput").value.trim();
      const resultBox = document.getElementById("searchResultDisplay");
      if (!uname) return;

      resultBox.innerHTML = `<p style="font-size:12px; color:var(--md-sys-color-outline);">正在查询 D1 用户中心...</p>`;

      let found = null;

      try {
        // 请求 Cloudflare D1 用户中心接口
        const res = await fetch(`/api/users/search?username=${encodeURIComponent(uname)}`);
        if (res.ok) {
          const json = await res.json();
          if (json.success && json.data) {
            found = {
              id: json.data.id || `user_${json.data.username}`,
              name: json.data.username,
              avatar: json.data.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${json.data.username}`
            };
          } else if (json.user) {
            found = {
              id: json.user.id || `user_${json.user.username}`,
              name: json.user.username,
              avatar: json.user.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${json.user.username}`
            };
          }
        }
      } catch (e) {
        console.warn("查询 D1 接口异常:", e);
      }

      // 如果 D1 数据库中确实未检索到该用户，给出错误提示，严禁构造假数据
      if (!found) {
        tempTargetUser = null;
        resultBox.innerHTML = `<p style="color:var(--md-sys-color-error); font-size:13px; margin-top:8px;">该用户不存在 (D1 数据库中未找到)</p>`;
        return;
      }

      // 不能添加自己为好友
      if (found.id === currentUser.id || found.name === currentUser.name) {
        resultBox.innerHTML = `<p style="color:var(--md-sys-color-outline); font-size:13px; margin-top:8px;">不能添加自己为好友</p>`;
        return;
      }

      tempTargetUser = found;
      const isAlreadyFriend = contacts.some(c => c.id === found.id || c.name === found.name);

      resultBox.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--md-sys-color-surface-container); padding:12px; border-radius:12px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:40px; height:40px; border-radius:50%; overflow:hidden;">
              <img src="${found.avatar}" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div>
              <div style="font-weight:600; font-size:14px;">${found.name}</div>
              <div style="font-size:11px; color:var(--md-sys-color-outline);">${found.id}</div>
            </div>
          </div>
          <div>
            ${isAlreadyFriend 
              ? `<button class="btn-tonal" onclick="closeModal('addFriendModalWrapper'); switchChat('${found.id}');">发消息</button>`
              : `<button class="btn-filled" onclick="openApplyModal()">添加到通讯录</button>`
            }
          </div>
        </div>
      `;
    }

    function openApplyModal() {
      closeModal('addFriendModalWrapper');
      document.getElementById("applyRemarkInput").value = tempTargetUser.name;
      document.getElementById("applyMessageInput").value = `我是 ${currentUser.name}`;
      openModal('applyModalWrapper');
    }

    // 提交好友申请（严格 7 天限制）
    async function submitFriendRequest() {
      if (!tempTargetUser) return;
      const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
      const now = Date.now();

      const existingReq = friendRequests.find(r => 
        r.sender_id === currentUser.id && 
        r.receiver_id === tempTargetUser.id && 
        r.status === 'pending' &&
        (now - new Date(r.created_at).getTime()) < SEVEN_DAYS_MS
      );

      if (existingReq) {
        alert("您已发送过好友申请，7天有效期内请耐心等待对方受理！");
        closeModal('applyModalWrapper');
        return;
      }

      const reqPayload = {
        id: `req_${Date.now()}_${Math.random().toString(36).substring(2,6)}`,
        sender_id: currentUser.id,
        sender_name: currentUser.name,
        sender_avatar: currentUser.avatar,
        receiver_id: tempTargetUser.id,
        receiver_name: tempTargetUser.name,
        message: document.getElementById("applyMessageInput").value.trim(),
        remark: document.getElementById("applyRemarkInput").value.trim(),
        permission: document.querySelector('input[name="friendPermission"]:checked').value,
        status: 'pending',
        created_at: new Date().toISOString()
      };

      friendRequests.unshift(reqPayload);
      saveFriendRequests();

      try {
        if (sbClient) {
          await sbClient.from('friend_requests').insert([reqPayload]);
        }
      } catch (e) {
        console.warn("保存到 Supabase 失败", e);
      }

      alert("好友申请已发送！");
      closeModal('applyModalWrapper');
      switchNavTab('contacts');
    }

    function loadFriendRequests() {
      const saved = localStorage.getItem(`MD3_REQ_${currentUser.id}`);
      if (saved) friendRequests = JSON.parse(saved);
      checkBadgeDot();
    }

    function saveFriendRequests() {
      localStorage.setItem(`MD3_REQ_${currentUser.id}`, JSON.stringify(friendRequests));
      checkBadgeDot();
    }

    function checkBadgeDot() {
      const hasPending = friendRequests.some(r => r.receiver_id === currentUser.id && r.status === 'pending');
      document.getElementById("contactBadgeDot").classList.toggle("show", hasPending);
    }

    function renderFriendRequestsList() {
      const container = document.getElementById("requestsPanel");
      container.innerHTML = "";

      if (friendRequests.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); margin-top:40px;">暂无好友验证消息</div>`;
        return;
      }

      const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
      const now = Date.now();

      friendRequests.forEach(req => {
        const isIncoming = req.receiver_id === currentUser.id;
        const isExpired = (now - new Date(req.created_at).getTime()) > SEVEN_DAYS_MS;
        const card = document.createElement("div");
        card.className = "req-card";

        let statusText = "待受理";
        if (req.status === 'accepted') statusText = "已同意";
        else if (req.status === 'rejected') statusText = "已拒绝";
        else if (isExpired) statusText = "已过期";

        card.innerHTML = `
          <div class="req-user-info">
            <div class="req-user-avatar">
              <img src="${isIncoming ? req.sender_avatar : 'https://api.dicebear.com/7.x/bottts/svg?seed=' + req.receiver_id}">
            </div>
            <div>
              <div class="req-meta-name">${isIncoming ? req.sender_name : req.receiver_name} ${isIncoming ? '<span style="font-size:11px; color:var(--md-sys-color-primary);">(对方申请)</span>' : '<span style="font-size:11px; color:var(--md-sys-color-outline);">(我发起的)</span>'}</div>
              <div class="req-meta-msg">“${req.message || '申请添加你为朋友'}”</div>
              <div class="req-meta-time">${new Date(req.created_at).toLocaleDateString()} ${new Date(req.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            </div>
          </div>
          <div class="req-actions">
            ${isIncoming && req.status === 'pending' && !isExpired ? `
              <button class="btn-filled" onclick="handleRequest('${req.id}', 'accepted')">接受</button>
              <button class="btn-danger" onclick="handleRequest('${req.id}', 'rejected')">拒绝</button>
            ` : `
              <span style="font-size:13px; font-weight:500; color:var(--md-sys-color-outline);">${statusText}</span>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function handleRequest(reqId, action) {
      const req = friendRequests.find(r => r.id === reqId);
      if (!req) return;

      req.status = action;
      saveFriendRequests();
      renderFriendRequestsList();

      if (action === 'accepted') {
        const newContact = {
          id: req.sender_id,
          name: req.remark || req.sender_name,
          avatar: req.sender_avatar,
          lastMsg: "已通过好友申请，开始聊天吧",
          lastTime: "刚刚",
          timestamp: Date.now()
        };
        contacts.push(newContact);
        saveContacts();
        renderCurrentTabList();

        activeChatId = req.sender_id;
        await sendMessage("text", { content: "我通过了你的好友验证请求，现在我们可以开始聊天了。" });
      }

      try {
        if (sbClient) {
          await sbClient.from('friend_requests').update({ status: action }).eq('id', reqId);
        }
      } catch (e) {}
    }

    // ====================================================
    // 6. 云端消息收发与实时订阅
    // ====================================================
    async function loadMessagesForActiveChat() {
      const container = document.getElementById("messagesViewport");
      container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); font-size:12px;">加载记录中...</div>`;

      try {
        if (!sbClient) throw new Error("No client");
        const { data, error } = await sbClient
          .from('messages')
          .select('*')
          .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatId}),and(sender_id.eq.${activeChatId},receiver_id.eq.${currentUser.id})`)
          .order('created_at', { ascending: true });

        if (error) throw error;
        currentChatMessages = data || [];
      } catch (err) {
        const localKey = `MSGS_${currentUser.id}_${activeChatId}`;
        currentChatMessages = JSON.parse(localStorage.getItem(localKey) || "[]");
      }
      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById("messagesViewport");
      container.innerHTML = "";

      if (currentChatMessages.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); font-size:12px; margin-top:20px;">暂无历史消息</div>`;
        return;
      }

      currentChatMessages.forEach(msg => {
        const isMe = msg.sender_id === currentUser.id;
        const row = document.createElement("div");
        row.className = `message-row ${isMe ? 'sent' : 'received'}`;
        
        let contentHtml = "";
        if (msg.msg_type === 'image') {
          contentHtml = `<img src="${msg.file_url}" class="img-bubble" onclick="window.open('${msg.file_url}')">`;
        } else if (msg.msg_type === 'file') {
          contentHtml = `
            <a href="${msg.file_url}" target="_blank" class="file-bubble" download="${msg.file_name}">
              <span class="material-symbols-outlined">description</span>
              <div>
                <div style="font-weight:500; font-size:13px;">${msg.file_name}</div>
                <div style="font-size:11px; opacity:0.7;">${msg.file_size || '文件'}</div>
              </div>
            </a>`;
        } else {
          contentHtml = `<div class="msg-bubble">${msg.content}</div>`;
        }

        const avatar = isMe ? currentUser.avatar : (contacts.find(c=>c.id === msg.sender_id)?.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + msg.sender_id);
        row.innerHTML = `<div class="msg-avatar"><img src="${avatar}"></div>${contentHtml}`;
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(type = "text", payload = {}) {
      const textarea = document.getElementById("chatInput");
      const content = payload.content || textarea.value.trim();
      if (!content && type === 'text') return;

      const newMsg = {
        sender_id: currentUser.id,
        receiver_id: activeChatId,
        msg_type: type,
        content: content || '',
        file_url: payload.file_url || null,
        file_name: payload.file_name || null,
        file_size: payload.file_size || null,
        created_at: new Date().toISOString()
      };

      currentChatMessages.push(newMsg);
      renderMessages();
      if (type === 'text') textarea.value = "";

      const c = contacts.find(item => item.id === activeChatId);
      if (c) {
        c.lastMsg = type === 'text' ? content : `[${type}]`;
        c.lastTime = "刚刚";
        c.timestamp = Date.now();
        saveContacts();
        renderCurrentTabList();
      }

      try {
        if (!sbClient) throw new Error();
        await sbClient.from('messages').insert([newMsg]);
      } catch (e) {
        localStorage.setItem(`MSGS_${currentUser.id}_${activeChatId}`, JSON.stringify(currentChatMessages));
      }
    }

    function initRealtimeSub() {
      if (!sbClient) return;

      sbClient.channel('realtime:chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          if (msg.receiver_id === currentUser.id) {
            if (msg.sender_id === activeChatId) {
              currentChatMessages.push(msg);
              renderMessages();
            }
          }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'friend_requests' }, payload => {
          const req = payload.new;
          if (req.receiver_id === currentUser.id) {
            friendRequests.unshift(req);
            saveFriendRequests();
            if (currentTab === 'contacts') renderFriendRequestsList();
          }
        })
        .subscribe();
    }

    // ====================================================
    // 7. 文件处理与常用交互
    // ====================================================
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith("image/");
      const reader = new FileReader();
      reader.onload = async (event) => {
        await sendMessage(isImage ? 'image' : 'file', {
          content: isImage ? '[图片]' : `[文件] ${file.name}`,
          file_url: event.target.result,
          file_name: file.name,
          file_size: `${(file.size / 1024).toFixed(1)} KB`
        });
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function insertEmoji(emoji) {
      const input = document.getElementById("chatInput");
      input.value += emoji;
      input.focus();
    }

    // ====================================================
    // 8. 窗口自由拖拽与防越界机制 (Draggable System)
    // ====================================================
    let dragState = { isDragging: false, currentEl: null, startX: 0, startY: 0, initialLeft: 0, initialTop: 0 };

    function startDrag(e, elementId) {
      const el = document.getElementById(elementId);
      dragState.isDragging = true;
      dragState.currentEl = el;
      dragState.startX = e.clientX;
      dragState.startY = e.clientY;
      dragState.initialLeft = el.offsetLeft;
      dragState.initialTop = el.offsetTop;

      document.addEventListener("mousemove", onDragging);
      document.addEventListener("mouseup", stopDrag);
    }

    function onDragging(e) {
      if (!dragState.isDragging || !dragState.currentEl) return;
      const el = dragState.currentEl;
      
      let newLeft = dragState.initialLeft + (e.clientX - dragState.startX);
      let newTop = dragState.initialTop + (e.clientY - dragState.startY);

      const maxLeft = window.innerWidth - el.offsetWidth;
      const maxTop = window.innerHeight - el.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      el.style.left = `${newLeft}px`;
      el.style.top = `${newTop}px`;
    }

    function stopDrag() {
      dragState.isDragging = false;
      dragState.currentEl = null;
      document.removeEventListener("mousemove", onDragging);
      document.removeEventListener("mouseup", stopDrag);
    }

    function openModal(wrapperId) { document.getElementById(wrapperId).classList.add("open"); }
    function closeModal(wrapperId) { document.getElementById(wrapperId).classList.remove("open"); }

    function openProfileCard() { openModal("profileModalWrapper"); }
    function openAddFriendModal() { 
      document.getElementById("searchResultDisplay").innerHTML = "";
      document.getElementById("searchUsernameInput").value = "";
      openModal("addFriendModalWrapper"); 
    }
    function openSettingsModal() { 
      document.getElementById("setUname").innerText = currentUser.name;
      document.getElementById("setUid").innerText = currentUser.id;
      openModal("settingsModalWrapper"); 
    }

    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener("DOMContentLoaded", initUserInfo);
  </script>
</body>
</html>
