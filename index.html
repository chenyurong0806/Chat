<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MD3 Cloud Chat</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      /* Google Material Design 3 Color Tokens */
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-dim: #ded8e1;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f7f2fa;
      --md-sys-color-surface-container: #f3edf7;
      --md-sys-color-surface-container-high: #ece6f0;
      --md-sys-color-surface-container-highest: #e6e0e9;
      --md-sys-color-on-surface: #1d1b20;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #cac4d0;
      --md-sys-color-secondary-container: #c2e7ff;
      --md-sys-color-on-secondary-container: #001d35;
      
      /* Elevations & Shapes */
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 16px;
      --md-shape-corner-large: 24px;
      --md-shape-corner-full: 9999px;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.12), 0 1px 2px 0 rgba(0,0,0,0.24);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px 0 rgba(0,0,0,0.3);
      --md-elevation-3: 0 4px 12px 3px rgba(0,0,0,0.12), 0 1px 3px 0 rgba(0,0,0,0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Noto Sans SC', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    /* 整体撑满屏幕的主容器 */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      background: var(--md-sys-color-surface);
    }

    /* ================= 1. 左侧导航轨 (Nav Rail) ================= */
    .nav-rail {
      width: 68px;
      height: 100%;
      background: var(--md-sys-color-surface-container);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      z-index: 10;
      flex-shrink: 0;
    }

    .user-avatar-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      margin-bottom: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--md-sys-color-primary-container);
      box-shadow: var(--md-elevation-1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .user-avatar-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--md-elevation-2);
    }
    .user-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-item {
      width: 48px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      transition: all 0.2s ease;
    }
    .nav-item:hover { background: var(--md-sys-color-surface-container-high); }
    .nav-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .nav-spacer { flex: 1; }

    /* ================= 2. 会话列表栏 (Chat List) ================= */
    .chat-sidebar {
      width: 310px;
      height: 100%;
      background: var(--md-sys-color-surface-container-low);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      height: 38px;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: var(--md-shape-corner-full);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: var(--md-sys-color-outline);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--md-shape-corner-full);
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:hover { background: var(--md-sys-color-surface-container-highest); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--md-shape-corner-medium);
      cursor: pointer;
      gap: 12px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    .chat-item:hover { background: var(--md-sys-color-surface-container); }
    .chat-item.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    .chat-item-avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-surface-container-highest);
      flex-shrink: 0;
      overflow: hidden;
    }
    .chat-item-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .chat-item-info { flex: 1; min-width: 0; }
    .chat-item-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
    .chat-item-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item-time { font-size: 11px; opacity: 0.7; }
    .chat-item-msg { font-size: 13px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ================= 3. 右侧主聊天界面 (Chat Stage) ================= */
    .chat-stage {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--md-sys-color-surface);
      position: relative;
    }

    .chat-header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
    }
    .chat-header-title { font-size: 16px; font-weight: 600; }

    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--md-sys-color-surface-container-lowest);
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 72%;
      user-select: text;
    }
    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-row.received { align-self: flex-start; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
      flex-shrink: 0;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-bubble {
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .message-row.sent .msg-bubble {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 20px 4px 20px 20px;
    }
    .message-row.received .msg-bubble {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-radius: 4px 20px 20px 20px;
    }

    .file-bubble {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
    }
    .file-bubble .material-symbols-outlined { font-size: 32px; color: var(--md-sys-color-primary); }
    .file-bubble-name { font-weight: 500; font-size: 13px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-bubble-size { font-size: 11px; color: var(--md-sys-color-outline); }

    .img-bubble {
      max-width: 260px;
      max-height: 260px;
      border-radius: var(--md-shape-corner-medium);
      cursor: pointer;
      object-fit: cover;
    }

    /* 输入区域 */
    .chat-input-container {
      padding: 12px 20px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-toolbar { display: flex; gap: 4px; }
    .chat-textarea {
      width: 100%;
      height: 64px;
      resize: none;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      background: transparent;
      user-select: text;
    }
    .input-bottom { display: flex; justify-content: flex-end; }
    .btn-send {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 6px 20px;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-send:hover { opacity: 0.9; }

    /* ================= 4. MD3 弹窗 & 头像资料卡 ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    /* 头像名片弹窗 (仿微信朋友圈资料卡) */
    .profile-card {
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-large);
      padding: 24px;
      width: 320px;
      box-shadow: var(--md-elevation-3);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .profile-header { display: flex; gap: 16px; align-items: center; }
    .profile-avatar-lg {
      width: 60px;
      height: 60px;
      border-radius: var(--md-shape-corner-medium);
      overflow: hidden;
      background: var(--md-sys-color-surface-container-highest);
    }
    .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .profile-uid { font-size: 12px; color: var(--md-sys-color-outline); margin-top: 4px; }
    
    .profile-moments {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .profile-moments-label { font-size: 13px; color: var(--md-sys-color-on-surface-variant); width: 44px; }
    .moments-grid { display: flex; gap: 6px; }
    .moments-item {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      background-size: cover;
      background-position: center;
      background-color: var(--md-sys-color-surface-container-highest);
    }

    .profile-actions { display: flex; justify-content: center; padding-top: 8px; }
    .profile-send-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--md-sys-color-primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    /* 常用 MD3 通用弹窗 (设置、添加好友) */
    .md3-dialog {
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-large);
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--md-elevation-3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .md3-dialog-title { font-size: 18px; font-weight: 600; }
    .md3-text-field {
      width: 100%;
      height: 48px;
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-corner-small);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 0 12px;
      outline: none;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
    }
    .md3-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border: none;
      padding: 8px 18px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .btn-text {
      background: transparent;
      border: none;
      padding: 8px 16px;
      color: var(--md-sys-color-outline);
      cursor: pointer;
      font-size: 13px;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- 1. 左侧导航 Rail -->
    <aside class="nav-rail">
      <div class="user-avatar-btn" id="myAvatarBtn" onclick="openProfileCard()">
        <img id="myAvatarImg" src="" alt="Me">
      </div>

      <div class="nav-item active" title="消息">
        <span class="material-symbols-outlined">chat_bubble</span>
      </div>

      <div class="nav-item" title="通讯录" onclick="alert('通讯录已整合在左侧好友列表中')">
        <span class="material-symbols-outlined">contacts</span>
      </div>

      <div class="nav-spacer"></div>

      <div class="nav-item" id="navSettingsBtn" title="更多/设置" onclick="openSettingsModal()">
        <span class="material-symbols-outlined">menu</span>
      </div>
    </aside>

    <!-- 2. 会话列表 -->
    <section class="chat-sidebar">
      <div class="sidebar-header">
        <div class="search-box">
          <span class="material-symbols-outlined" style="font-size: 18px;">search</span>
          <input type="text" id="searchInput" placeholder="搜索好友..." oninput="filterChats()">
        </div>
        <button class="icon-btn" title="添加好友" onclick="openAddFriendModal()">
          <span class="material-symbols-outlined">add</span>
        </button>
      </div>

      <div class="chat-list" id="chatListContainer">
        <!-- 动态渲染好友列表 -->
      </div>
    </section>

    <!-- 3. 右侧主聊天面板 -->
    <main class="chat-stage">
      <div class="chat-header">
        <div class="chat-header-title" id="chatHeaderTitle">文件传输助手 (自己)</div>
        <button class="icon-btn"><span class="material-symbols-outlined">more_horiz</span></button>
      </div>

      <div class="messages-viewport" id="messagesViewport">
        <!-- 动态消息列表 -->
      </div>

      <div class="chat-input-container">
        <div class="input-toolbar">
          <button class="icon-btn" title="表情" onclick="insertEmoji('😊')">
            <span class="material-symbols-outlined">mood</span>
          </button>
          <button class="icon-btn" title="上传文件" onclick="document.getElementById('fileInput').click()">
            <span class="material-symbols-outlined">folder</span>
          </button>
          <input type="file" id="fileInput" onchange="handleFileUpload(event)">
        </div>

        <textarea class="chat-textarea" id="chatInput" placeholder="输入消息 (Enter 发送)..."></textarea>

        <div class="input-bottom">
          <button class="btn-send" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= 弹窗模块 ================= -->

  <!-- 头像资料卡弹窗 -->
  <div class="modal-backdrop" id="profileCardModal" onclick="closeModalOnBackdrop(event, 'profileCardModal')">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar-lg">
          <img id="cardAvatar" src="" alt="avatar">
        </div>
        <div>
          <div class="profile-name"><span id="cardName">--</span> <span>🍊</span></div>
          <div class="profile-uid" id="cardUid">uid: --</div>
        </div>
      </div>

      <div class="profile-moments">
        <div class="profile-moments-label">朋友圈</div>
        <div class="moments-grid">
          <div class="moments-item" style="background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100');"></div>
          <div class="moments-item" style="background-image:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=100');"></div>
          <div class="moments-item" style="background-image:url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=100');"></div>
          <div class="moments-item" style="background-image:url('https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=100');"></div>
        </div>
      </div>

      <div class="profile-actions">
        <button class="profile-send-btn" onclick="startChatWithSelf()">
          <span class="material-symbols-outlined" style="font-size: 26px;">chat</span>
          <span>发消息</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 添加好友弹窗 -->
  <div class="modal-backdrop" id="addFriendModal" onclick="closeModalOnBackdrop(event, 'addFriendModal')">
    <div class="md3-dialog">
      <div class="md3-dialog-title">添加好友</div>
      <p style="font-size:13px; color:var(--md-sys-color-outline);">通过全局 username 进行搜索添加</p>
      <input type="text" class="md3-text-field" id="searchFriendUsername" placeholder="输入对方用户名 (username)...">
      <div id="searchResultArea"></div>
      <div class="md3-dialog-actions">
        <button class="btn-text" onclick="closeModal('addFriendModal')">取消</button>
        <button class="btn-tonal" onclick="searchAndAddUser()">查找并添加</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-backdrop" id="settingsModal" onclick="closeModalOnBackdrop(event, 'settingsModal')">
    <div class="md3-dialog">
      <div class="md3-dialog-title">系统设置</div>
      <div style="font-size: 13px; display:flex; flex-direction:column; gap:8px;">
        <div><strong>当前用户：</strong><span id="setUname"></span></div>
        <div><strong>UID：</strong><span id="setUid"></span></div>
        <div><strong>云端实时：</strong>Supabase Realtime 已启用</div>
      </div>
      <div class="md3-dialog-actions">
        <button class="btn-tonal" onclick="closeModal('settingsModal')">确定</button>
      </div>
    </div>
  </div>

  <script>
    // ====================================================
    // 1. Supabase Client 初始化与配置
    // ====================================================
    const SUPABASE_URL = "https://mamubvgmcetepllznifl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_HEeNPSqD75cWlnmZjcVHKA_Pw-OdL_A";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ====================================================
    // 2. 全局状态
    // ====================================================
    let currentUser = { id: "", name: "", isLoggedIn: false, avatar: "" };
    let contacts = []; // 好友列表
    let activeChatId = ""; // 当前选中的联系人 ID
    let currentChatMessages = []; // 当前窗口消息列表

    // ====================================================
    // 3. 用户信息初始化
    // ====================================================
    async function initUserInfo() {
      const IS_DEV_LOGIN = false;

      if (IS_DEV_LOGIN) {
        currentUser = { id: "dev_user_001", name: "本地调试员", isLoggedIn: true, avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=dev_user_001" };
        postInit();
        return;
      }

      try {
        const res = await fetch("/api/userinfo");
        if (res.ok) {
          const result = await res.json();
          if (result.loggedIn && result.data && result.data.username) {
            currentUser = {
              id: result.data.id || `user_${result.data.username}`,
              name: result.data.username,
              isLoggedIn: true,
              avatar: result.data.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${result.data.username}`
            };
          } else {
            throw new Error("未登录");
          }
        } else {
          throw new Error("网络响应异常");
        }
      } catch (e) {
        let guestId = localStorage.getItem("MD3_GUEST_UID");
        let guestName = localStorage.getItem("MD3_GUEST_UNAME");
        if (!guestId) {
          guestId = `guest_${Math.random().toString(36).substring(2, 10)}`;
          guestName = `橙子_${Math.floor(Math.random() * 1000)}`;
          localStorage.setItem("MD3_GUEST_UID", guestId);
          localStorage.setItem("MD3_GUEST_UNAME", guestName);
        }
        currentUser = { 
          id: guestId, 
          name: guestName, 
          isLoggedIn: false, 
          avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${guestId}` 
        };
      }

      postInit();
    }

    function postInit() {
      // 渲染主界面当前头像与信息
      document.getElementById("myAvatarImg").src = currentUser.avatar;
      document.getElementById("cardAvatar").src = currentUser.avatar;
      document.getElementById("cardName").innerText = currentUser.name;
      document.getElementById("cardUid").innerText = `uid:${currentUser.id}`;

      // 初始化联系人列表：只包含“自己”
      loadContacts();
      // 开启 Supabase Realtime 监听消息
      initSupabaseRealtime();
    }

    // ====================================================
    // 4. 联系人与聊天管理 (用户隔离)
    // ====================================================
    function loadContacts() {
      const storageKey = `MD3_CONTACTS_${currentUser.id}`;
      const saved = localStorage.getItem(storageKey);
      
      if (saved) {
        contacts = JSON.parse(saved);
      } else {
        // 初始仅添加“自己”
        contacts = [
          {
            id: currentUser.id,
            name: `${currentUser.name} (自己)`,
            avatar: currentUser.avatar,
            lastMsg: "点击开始记录自我备忘",
            lastTime: "刚刚",
            timestamp: Date.now()
          }
        ];
        saveContacts();
      }

      activeChatId = contacts[0].id;
      renderChatList();
      loadMessagesForActiveChat();
    }

    function saveContacts() {
      const storageKey = `MD3_CONTACTS_${currentUser.id}`;
      localStorage.setItem(storageKey, JSON.stringify(contacts));
    }

    function renderChatList() {
      const container = document.getElementById("chatListContainer");
      container.innerHTML = "";

      contacts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      contacts.forEach(contact => {
        const item = document.createElement("div");
        item.className = `chat-item ${contact.id === activeChatId ? 'active' : ''}`;
        item.onclick = () => switchChat(contact.id);
        item.innerHTML = `
          <div class="chat-item-avatar">
            <img src="${contact.avatar}" alt="">
          </div>
          <div class="chat-item-info">
            <div class="chat-item-top">
              <span class="chat-item-name">${contact.name}</span>
              <span class="chat-item-time">${contact.lastTime || ''}</span>
            </div>
            <div class="chat-item-msg">${contact.lastMsg || ''}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function switchChat(contactId) {
      activeChatId = contactId;
      renderChatList();
      const current = contacts.find(c => c.id === activeChatId);
      if (current) {
        document.getElementById("chatHeaderTitle").innerText = current.name;
      }
      loadMessagesForActiveChat();
    }

    // ====================================================
    // 5. 云端消息读取 & 发送 (含用户隔离)
    // ====================================================
    async function loadMessagesForActiveChat() {
      const container = document.getElementById("messagesViewport");
      container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); font-size:12px;">加载云端记录中...</div>`;

      try {
        // 用户隔离查询：(sender = me and receiver = active) OR (sender = active and receiver = me)
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatId}),and(sender_id.eq.${activeChatId},receiver_id.eq.${currentUser.id})`)
          .order('created_at', { ascending: true });

        if (error) throw error;
        currentChatMessages = data || [];
      } catch (err) {
        console.warn("从 Supabase 加载失败或表未创建，启用本地缓存读取", err);
        const localKey = `MSGS_${currentUser.id}_${activeChatId}`;
        currentChatMessages = JSON.parse(localStorage.getItem(localKey) || "[]");
      }

      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById("messagesViewport");
      container.innerHTML = "";

      if (currentChatMessages.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--md-sys-color-outline); font-size:12px; margin-top:20px;">暂无历史消息，打个招呼吧</div>`;
        return;
      }

      currentChatMessages.forEach(msg => {
        const isMe = msg.sender_id === currentUser.id;
        const row = document.createElement("div");
        row.className = `message-row ${isMe ? 'sent' : 'received'}`;
        
        let contentHtml = "";
        if (msg.msg_type === 'image') {
          contentHtml = `<img src="${msg.file_url}" class="img-bubble" onclick="window.open('${msg.file_url}')">`;
        } else if (msg.msg_type === 'file') {
          contentHtml = `
            <a href="${msg.file_url}" target="_blank" class="file-bubble" download="${msg.file_name}">
              <span class="material-symbols-outlined">description</span>
              <div>
                <div class="file-bubble-name">${msg.file_name}</div>
                <div class="file-bubble-size">${msg.file_size || '文件'}</div>
              </div>
            </a>`;
        } else {
          contentHtml = `<div class="msg-bubble">${msg.content}</div>`;
        }

        const avatar = isMe ? currentUser.avatar : (contacts.find(c=>c.id === msg.sender_id)?.avatar || currentUser.avatar);

        row.innerHTML = `
          <div class="msg-avatar"><img src="${avatar}"></div>
          ${contentHtml}
        `;
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(type = "text", payload = {}) {
      const textarea = document.getElementById("chatInput");
      const content = payload.content || textarea.value.trim();
      if (!content && type === 'text') return;

      const newMsg = {
        sender_id: currentUser.id,
        receiver_id: activeChatId,
        msg_type: type,
        content: content || '',
        file_url: payload.file_url || null,
        file_name: payload.file_name || null,
        file_size: payload.file_size || null,
        created_at: new Date().toISOString()
      };

      // 1. 本地迅速呈现
      currentChatMessages.push(newMsg);
      renderMessages();
      if (type === 'text') textarea.value = "";

      // 更新联系人列表中的最后一条消息
      updateContactLastMessage(activeChatId, type === 'text' ? content : `[${type}]`);

      // 2. 上传到 Supabase
      try {
        const { error } = await supabase.from('messages').insert([newMsg]);
        if (error) throw error;
      } catch (err) {
        console.warn("保存到 Supabase 失败，已转存本地", err);
        const localKey = `MSGS_${currentUser.id}_${activeChatId}`;
        localStorage.setItem(localKey, JSON.stringify(currentChatMessages));
      }
    }

    function updateContactLastMessage(contactId, preview) {
      const contact = contacts.find(c => c.id === contactId);
      if (contact) {
        contact.lastMsg = preview;
        contact.lastTime = "刚刚";
        contact.timestamp = Date.now();
        saveContacts();
        renderChatList();
      }
    }

    // ====================================================
    // 6. Supabase Realtime 实时订阅
    // ====================================================
    function initSupabaseRealtime() {
      supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          // 仅接收与当前登录用户相关的隔离数据
          if (msg.receiver_id === currentUser.id) {
            if (msg.sender_id === activeChatId) {
              currentChatMessages.push(msg);
              renderMessages();
            }
            updateContactLastMessage(msg.sender_id, msg.msg_type === 'text' ? msg.content : `[${msg.msg_type}]`);
          }
        })
        .subscribe();
    }

    // ====================================================
    // 7. 文件与图片上传识别
    // ====================================================
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith("image/");
      const reader = new FileReader();

      reader.onload = async (event) => {
        const base64Url = event.target.result;
        await sendMessage(isImage ? 'image' : 'file', {
          content: isImage ? '[图片]' : `[文件] ${file.name}`,
          file_url: base64Url,
          file_name: file.name,
          file_size: `${(file.size / 1024).toFixed(1)} KB`
        });
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function insertEmoji(emoji) {
      const input = document.getElementById("chatInput");
      input.value += emoji;
      input.focus();
    }

    // ====================================================
    // 8. 添加好友 (查询 D1 / API / Supabase)
    // ====================================================
    async function searchAndAddUser() {
      const targetUsername = document.getElementById("searchFriendUsername").value.trim();
      const resultArea = document.getElementById("searchResultArea");
      if (!targetUsername) return;

      resultArea.innerHTML = `<p style="font-size:12px; color:var(--md-sys-color-outline); margin-top:8px;">正在从用户中心查询...</p>`;

      let foundUser = null;

      // 1. 尝试从 Cloudflare D1 驱动的后端接口查询
      try {
        const res = await fetch(`/api/users/search?username=${encodeURIComponent(targetUsername)}`);
        if (res.ok) {
          const json = await res.json();
          if (json.user) foundUser = json.user;
        }
      } catch (err) {
        console.log("D1 API 查询未响应，尝试 Supabase profiles 表");
      }

      // 2. 备选方案：从 Supabase users/profiles 查询或构造临时好友
      if (!foundUser) {
        try {
          const { data } = await supabase.from('profiles').select('*').eq('username', targetUsername).single();
          if (data) foundUser = data;
        } catch (e) {}
      }

      // 如果未找到任何云端实体，按输入名称直接建立新会话对象
      if (!foundUser) {
        foundUser = {
          id: `user_${targetUsername}`,
          name: targetUsername,
          avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${targetUsername}`
        };
      }

      // 判断是否已存在
      const exists = contacts.find(c => c.id === foundUser.id || c.name === foundUser.name);
      if (exists) {
        resultArea.innerHTML = `<p style="color:var(--md-sys-color-primary); font-size:13px; margin-top:8px;">该好友已在列表</p>`;
        return;
      }

      contacts.push({
        id: foundUser.id,
        name: foundUser.name || foundUser.username,
        avatar: foundUser.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${foundUser.username}`,
        lastMsg: "已添加新好友，点击发消息",
        lastTime: "刚刚",
        timestamp: Date.now()
      });

      saveContacts();
      renderChatList();
      switchChat(foundUser.id);
      closeModal('addFriendModal');
      document.getElementById("searchFriendUsername").value = "";
      resultArea.innerHTML = "";
    }

    // ====================================================
    // 9. 弹窗控制
    // ====================================================
    function openProfileCard() { document.getElementById("profileCardModal").classList.add("open"); }
    function openAddFriendModal() { document.getElementById("addFriendModal").classList.add("open"); }
    function openSettingsModal() { 
      document.getElementById("setUname").innerText = currentUser.name;
      document.getElementById("setUid").innerText = currentUser.id;
      document.getElementById("settingsModal").classList.add("open"); 
    }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function closeModalOnBackdrop(e, id) { if (e.target.id === id) closeModal(id); }

    function startChatWithSelf() {
      closeModal('profileCardModal');
      switchChat(currentUser.id);
    }

    // 快捷键 Enter 发送
    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 启动运行
    window.addEventListener("DOMContentLoaded", initUserInfo);
  </script>
</body>
</html>
